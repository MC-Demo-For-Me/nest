version: "3"

services:
  mysql:
    image: mysql:9
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3306:3306"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/lib/mysql
      - /tmp
      - /var/run/mysqld
